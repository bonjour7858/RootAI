<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RootIA - Intelligence Artificielle</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }
        .container {
            max-width: 600px;
            padding: 40px;
            background: #161b22;
            border-radius: 16px;
            border: 1px solid #30363d;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #58a6ff, #bc8cff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p {
            font-size: 1.2rem;
            color: #8b949e;
            margin-bottom: 30px;
        }
        .badge {
            display: inline-block;
            padding: 8px 16px;
            background: rgba(56, 189, 248, 0.1);
            color: #38bdf8;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: bold;
            border: 1px solid rgba(56, 189, 248, 0.3);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>RootIA 🤖</h1>
        <p>Projet d'Intelligence Artificielle de nouvelle génération.</p>
        <span class="badge">🚀 En cours de développement</span>
    </div>
</body>
</html>
