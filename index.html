<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rootify - IA & Innovation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- NAVBAR -->
    <header class="navbar">
        <div class="logo" onclick="navigateTo('chat')">
            <span class="logo-icon">🤖</span> Rootify
        </div>
        <nav class="nav-links">
            <a data-page="chat" class="nav-btn active" onclick="navigateTo('chat')">IA Textuel</a>
            <a data-page="image" class="nav-btn" onclick="navigateTo('image')">IA Image</a>
            <a data-page="premium" class="nav-btn" onclick="navigateTo('premium')">Premium</a>
            <a id="link-admin" data-page="admin" class="nav-btn hidden" onclick="openAdminPinModal()">Admin</a>
        </nav>
        <div class="nav-actions">
            <a id="link-auth" class="btn-nav-secondary" onclick="navigateTo('auth')">Connexion</a>
            <button class="btn-nav-admin" onclick="openAdminPinModal()">🔑 Admin</button>
        </div>
    </header>

    <!-- RENDER DYNAMIQUE DES PAGES -->
    <main id="app-viewport" class="container">
        <!-- Le contenu dynamique s'injecte ici via script.js -->
    </main>

    <!-- WIDGET SUPPORT FLOTTANT DYNAMIQUE -->
    <div id="support-widget" class="support-widget">
        <button id="widget-toggle-btn" class="widget-toggle-btn" onclick="toggleSupportWidget()">💬</button>

        <div id="support-window" class="support-window">
            <div class="support-header">
                <div class="support-team">
                    <h4>Support Rootify (Live)</h4>
                    <p class="support-status">⏱️ En ligne - Réponses rapides</p>
                </div>
            </div>

            <div id="widget-chat-box" class="support-body"></div>

            <div class="support-footer">
                <input type="text" id="widget-input" placeholder="Posez votre question...">
                <button onclick="sendWidgetMessage()" class="btn-send">➢</button>
            </div>
            <div class="support-branding">Propulsé par <strong>Rootify Live Engine</strong></div>
        </div>
    </div>

    <!-- MODAL PAIEMENT TEST -->
    <div id="checkout-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeCheckoutModal()">&times;</span>
            <h3>💳 Simulation d'Achat VIP</h3>
            <form onsubmit="processTestPayment(event)">
                <input type="text" placeholder="Nom sur la carte" value="Jean Dupont" required style="margin-bottom:10px;">
                <input type="text" placeholder="Numéro de carte (Factice)" value="4242 •••• •••• 4242" required style="margin-bottom:10px;">
                <div class="flex-row">
                    <input type="text" placeholder="MM/AA" value="12/28" required>
                    <input type="text" placeholder="CVC" value="123" required>
                </div>
                <button type="submit" class="btn-main-orange full-width" style="margin-top:15px;">Payer 3,00 € (Mode Test)</button>
            </form>
        </div>
    </div>

    <!-- MODAL CODE PIN ADMIN -->
    <div id="admin-pin-modal" class="modal">
        <div class="modal-content" style="max-width:320px; text-align:center;">
            <span class="close-btn" onclick="closeAdminPinModal()">&times;</span>
            <h3>🔐 Accès Sécurisé</h3>
            <p style="margin:10px 0; font-size:0.85rem; color:#aaa;">Entrez le code PIN Administrateur :</p>
            <input type="password" id="admin-pin-input" placeholder="Code PIN (1234)" style="text-align:center; font-size:1.2rem; letter-spacing:5px; margin-bottom:15px;" maxlength="8">
            <button onclick="verifyAdminPin()" class="btn-main-orange full-width">Valider</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
